# Use the desktop sound server (PulseAudio or PipeWire's PulseAudio service).
# Do not load host ALSA configuration: it may require unbundled native plugins
# or select a hardware card, bypassing the desktop's output selection.
# Leaving device/server unset preserves desktop policy and PULSE_* overrides.
pcm.!default {
    type pulse
    hint {
        show on
        description "Default desktop audio output"
    }
}
ctl.!default {
    type pulse
}
