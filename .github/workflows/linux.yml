name: Linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "po/**"
      - "Cargo.toml"
      - "build.rs"
      - "build-aux/appimage/**"
      - ".appimage-po.sh"
      - ".github/workflows/linux.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates python3 pkg-config gettext \
            libadwaita-1-dev libasound2-dev libasound2-plugins libpulse-dev \
            libgdk-pixbuf2.0-bin libgtk-4-dev libssl-dev libdconf1 \
            dconf-gsettings-backend librsvg2-common desktop-file-utils \
            squashfs-tools zsync file shared-mime-info
          rustup update stable --no-self-update
          rustup default stable
      - name: Version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo 'Release tag must match Cargo.toml' >&2
              exit 1
            }
            echo "APPIMAGE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APPIMAGE_VERSION=v$version-test.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build AppImage
        run: ./build-aux/appimage/build.sh
      - name: Check static runtime and desktop entry
        shell: bash
        run: |
          image="listenmoe-$APPIMAGE_VERSION-${{ matrix.arch }}.AppImage"
          file "$image"
          if readelf -l "$image" | grep -q INTERP; then
            echo 'AppImage runtime unexpectedly needs a host ELF interpreter' >&2
            exit 1
          fi
          desktop-file-validate AppDir/*.desktop
      - name: Upload AppImage for validation
        uses: actions/upload-artifact@v4
        with:
          name: listenmoe-AppImage-${{ matrix.arch }}
          path: |
            *.AppImage
            *.AppImage.zsync
            *.AppImage.sha256
          if-no-files-found: error
      - name: Test window on clean Ubuntu 22.04 and 24.04
        timeout-minutes: 8
        shell: bash
        run: |
          for distro in 22.04 24.04; do
            docker build -t "listenmoe-smoke:$distro" - <<EOF
          FROM ubuntu:$distro
          RUN apt-get update && apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils xdotool dbus-daemon fonts-dejavu-core pulseaudio pulseaudio-utils python3 \
            && rm -rf /var/lib/apt/lists/*
          EOF
            docker run --rm --network none \
              -v "$PWD:/project:ro" "listenmoe-smoke:$distro" \
              timeout 180s xvfb-run -a dbus-run-session -- bash -x /project/build-aux/appimage/smoke-test.sh \
              "/project/listenmoe-$APPIMAGE_VERSION-${{ matrix.arch }}.AppImage"
          done


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: listenmoe-AppImage-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            *.AppImage
            *.AppImage.zsync
            *.AppImage.sha256
          overwrite_files: false
